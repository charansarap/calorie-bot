<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriBot 🥗</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 420px;
            height: 650px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .chat-header {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            color: white;
            font-size: 20px;
            font-weight: 700;
        }

        .chat-header p {
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            margin-top: 4px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .bot-message {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }

        .user-message {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border-bottom-right-radius: 4px;
            align-self: flex-end;
        }

        .typing {
            background: rgba(255,255,255,0.1);
            color: #aaa;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            font-style: italic;
            font-size: 13px;
        }

        .chat-input {
            padding: 16px;
            background: rgba(0,0,0,0.2);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .chat-input input::placeholder { color: rgba(255,255,255,0.4); }

        .chat-input input:focus {
            border-color: #38ef7d;
            background: rgba(255,255,255,0.12);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover { transform: scale(1.1); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🥗 NutriBot</h1>
            <p>Your Personal Nutrition Expert by Sai Charan</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">👋 Hi! I am <strong>NutriBot</strong>, your personal nutrition expert created by Sai Charan!

I can help you with:
🍽️ Calorie counts for any food
📊 BMI calculation
🥗 Personalized diet plans
💡 Healthy eating tips

What would you like to know?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ask about calories, diet plans..." />
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('userInput');
        const messages = document.getElementById('chatMessages');
        const sendBtn = document.getElementById('sendBtn');

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, 'user-message');
            input.value = '';
            sendBtn.disabled = true;

            const typing = addMessage('NutriBot is thinking... 🤔', 'typing');

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                typing.remove();
                addMessage(data.reply, 'bot-message');
            } catch {
                typing.remove();
                addMessage('Sorry, something went wrong. Please try again!', 'bot-message');
            }

            sendBtn.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
